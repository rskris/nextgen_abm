[project]
name = "nextgen-abm"
version = "0.1.0"
description = "Next Generation Activity-Based Travel Demand Model for Santa Barbara County"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "highspy>=1.8.0",
    "ortools>=9.10.0",
    "pydeck>=0.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "scipy>=1.13.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
nextgen-abm = "nextgen_abm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nextgen_abm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
